name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev pkg-config
          else
            brew install pkgconf
          fi
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: sh .github/scripts/check-symbols.sh build

  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, msvc: x64 }
          - { arch: x86, msvc: x86 }
          - { arch: arm64, msvc: amd64_arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      # Builds /MT and /MD, runs ctest, checks the layout and compiles the
      # examples against it (x64 and x86 only; arm64 is cross-built).
      - name: Package and check
        shell: pwsh
        run: .github/scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Version ci -Out "$env:RUNNER_TEMP\out"

  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: sh .github/scripts/check-mingw.sh build/liblatte.dll

  # WinHTTP against real TLS: the API (handshake, certificate), hosts with bad
  # certificates (must fail), and with the test secrets a full activate, renew
  # and deactivate. Without the secrets that last step is skipped.
  windows-https:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, platform: x64, msvc: x64, os: windows-latest }
          - { arch: x86, platform: Win32, msvc: x86, os: windows-latest }
          - { arch: arm64, platform: ARM64, msvc: arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    # One live run per arch at a time: each arch reuses one activation.
    concurrency:
      group: windows-https-${{ matrix.arch }}
      cancel-in-progress: false
    # Only whether the secrets exist; their values reach the live step alone.
    env:
      HAS_TEST_SECRETS: ${{ secrets.LATTE_TEST_PUBLISHABLE_KEY != '' && secrets.LATTE_TEST_LICENSE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      - run: cmake -S . -B build -A ${{ matrix.platform }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DLATTE_BUILD_SHARED=OFF
      - run: cmake --build build --config Release --target https_check
      - name: TLS handshake and certificate checks
        run: |
          build\Release\https_check.exe --accept https://api.licenselatte.com/v1/renew
          if %errorlevel% neq 0 exit /b 1
          build\Release\https_check.exe --reject https://expired.badssl.com/ https://wrong.host.badssl.com/ https://self-signed.badssl.com/ https://untrusted-root.badssl.com/
        shell: cmd
      - name: Activate, renew and deactivate
        if: env.HAS_TEST_SECRETS == 'true'
        env:
          LATTE_TEST_PUBLISHABLE_KEY: ${{ secrets.LATTE_TEST_PUBLISHABLE_KEY }}
          LATTE_TEST_LICENSE_KEY: ${{ secrets.LATTE_TEST_LICENSE_KEY }}
        run: build\Release\https_check.exe --live "%LATTE_TEST_PUBLISHABLE_KEY%" "%LATTE_TEST_LICENSE_KEY%" "latte-c-ci-windows-${{ matrix.arch }}"
        shell: cmd
      - name: Live check skipped
        if: env.HAS_TEST_SECRETS != 'true'
        run: echo "::notice::LATTE_TEST_PUBLISHABLE_KEY / LATTE_TEST_LICENSE_KEY are not set; activate, renew and deactivate were not run on ${{ matrix.arch }}."
        shell: bash
