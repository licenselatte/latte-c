name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev pkg-config
          else
            brew install pkgconf
          fi
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: sh .github/scripts/check-symbols.sh build

  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, msvc: x64 }
          - { arch: x86, msvc: x86 }
          - { arch: arm64, msvc: amd64_arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      # Builds /MT and /MD, runs ctest, checks the layout and compiles the
      # examples against it (x64 and x86 only; arm64 is cross-built).
      - name: Package and check
        shell: pwsh
        run: .github/scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Version ci -Out "$env:RUNNER_TEMP\out"

  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: sh .github/scripts/check-mingw.sh build/liblatte.dll
