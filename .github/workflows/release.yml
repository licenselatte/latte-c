name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # A pull request that touches the packaging runs it as a dry run: the zips
  # and SHA256SUMS are uploaded as artifacts, no release is created.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/package-windows.ps1
      - .github/scripts/check-windows.ps1
      - .github/release/**

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, msvc: x64 }
          - { arch: x86, msvc: x86 }
          - { arch: arm64, msvc: amd64_arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      - name: Version
        id: version
        shell: bash
        run: |
          cmake_version=$(sed -nE 's/^project\(latte-c VERSION ([0-9][0-9.]*).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            [ "${version%%-*}" = "$cmake_version" ] || { echo "tag $GITHUB_REF_NAME does not match CMakeLists.txt version $cmake_version"; exit 1; }
          else
            version=$cmake_version
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION -Out "$env:RUNNER_TEMP\out"
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*.zip
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $pre
      - name: Upload dry-run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/*
